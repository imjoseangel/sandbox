apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  namespace: argo
  generateName: coinflip-
spec:
  entrypoint: coinflip
  templates:
  - name: coinflip
    steps:
    # flip a coin
    - - name: flip-coin
        template: flip-coin
    - - name: approval
        template: approval
        when: "'{{steps.flip-coin.outputs.result}}' !~ '.*0 to destroy.*'"
    - - name: create-regex
        template: create
        when: "'{{steps.flip-coin.outputs.result}}' =~ '.*0 to destroy.*'"
      - name: destroy-regex
        template: destroy
        when: "'{{steps.approval.outputs.parameters.approve}}' == 'YES'"

  - name: flip-coin
    script:
      image: python:alpine3.6
      command: [python]
      source: |
        import random
        result = "0 to destroy" if random.randint(0,1) == 0 else "1 to destroy"
        print(result)

  - name: create
    container:
      image: alpine:3.6
      command: [sh, -c]
      args: ["echo \"0 to destroy\""]

  - name: destroy
    container:
      image: alpine:3.6
      command: [sh, -c]
      args: ["echo \"1 to destroy\""]

  - name: approval
    suspend: {}
    inputs:
        parameters:
          - name: approve
            default: 'NO'
            enum:
                - 'YES'
                - 'NO'
            description: >-
              Choose YES to confirm deployment
    outputs:
        parameters:
          - name: approve
            valueFrom:
                supplied: {}
